name: sg_env
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.7
  - cython
  - scipy
  - bokeh=1.1.0
  # Core data science libraries (already present but good to be explicit)
  - numpy
  - pandas
  - networkx
  # Libraries needed for tutorials and notebook execution
  - jupyter
  - ipykernel
  - matplotlib
  - wordcloud
  - pip
  - pip:
    - dist/stream_graph-1.0.0-cp37-cp37m-win_amd64.whl
